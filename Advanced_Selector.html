<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Food Menu</title>

    <style>
        body {
            font-family: Arial;
            background: #fff8f0;
            padding: 30px;
            text-align: center;
        }

        h1 { color: #f35f21;}

        h1 + p {
            background-color: #f35f21;
            padding: 10px 20px;
            border-radius: 8px;
            color: blue;
            display: inline-block;
        }

      ul { padding: 0; margin-top: 20px;}

      ul >li {
        list-style: none;
        font-size: 18px;
        font-weight: bold;
        color: #4CAF50;
        padding: 10px 20px;
        margin: 6px auto;
        width: 260px;
        background: #fff3e0;
        border-radius: 8px;
      }

      ul li:nth child(3) {
        background: #ffe082;
        color: #e65c00;

      }

      .desc {

color: #555;

margin-top: 20px;

font-size: 15px;

max-width: 400px;

margin-left: auto;

margin-right: auto;

}

/* first-letter - makes the first letter big and bold */

.desc::first-letter {

font-size: 220%;

color: #e65c00;

font-weight: bold;

}

.links { margin-top: 25px; }

/* Hover Effect - links glow when mouse moves over them */

a {

color: #e65c00;

text-decoration: none;

font-size: 15px;

margin: 0 12px;

padding: 8px 18px;

border: 2px solid #e65c00;

border-radius: 8px;

}

a:hover {

background: #e65c00;

color: white;

}
</style>
</head>
<body>
    
    
</body>
</html>
